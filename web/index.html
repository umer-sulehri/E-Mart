<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>E-Mart</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #111827;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      main {
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #6b7280;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1rem;
        border: 3px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner"></div>
      <h1>E-Mart</h1>
      <p>Loading&hellip;</p>
    </main>
  </body>
</html>
