<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6BB252" />
    <title>E-Mart &mdash; You&rsquo;re offline</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f2937;
        --muted: #4b5563;
        --brand: #3d7a2b;
        --brand-hover: #315e24;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --fg: #f8fafc;
          --muted: #cbd5e1;
          --brand: #6bb252;
          --brand-hover: #86c46f;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      .icon {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        background: rgba(107, 178, 82, 0.15);
        color: var(--brand);
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0 0 0.75rem;
      }
      p {
        max-width: 22rem;
        margin: 0 auto 1.75rem;
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.55;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.8rem 1.4rem;
        background: var(--brand);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-hover);
      }
      button:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
      .status {
        margin-top: 1rem;
        font-size: 0.8125rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">
        <svg
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 2l20 20" />
          <path d="M8.5 8.5a5 5 0 0 1 7 0" />
          <path d="M5 12.5a10 10 0 0 1 3-2" />
          <path d="M2 8.5a15 15 0 0 1 4-2.5" />
          <path d="M16 12.5a10 10 0 0 0-2-1.2" />
          <path d="M19 8.5a15 15 0 0 0-4-2.5" />
          <path d="M12 20h.01" />
        </svg>
      </div>
      <h1>You&rsquo;re offline</h1>
      <p>
        E-Mart needs an internet connection to load fresh prices and stock. Check your
        connection, then try again.
      </p>
      <button type="button" onclick="retry()">Try again</button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      var APP_URL = 'https://e-mart-sand-pi.vercel.app';

      function retry() {
        window.location.href = APP_URL;
      }

      function updateStatus() {
        document.getElementById('status').textContent = navigator.onLine
          ? 'Connection restored. Tap “Try again”.'
          : 'Still offline.';
      }

      updateStatus();
      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
    </script>
  </body>
</html>
